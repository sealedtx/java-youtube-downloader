name: Live checks

# Runs the tests tagged "live" against real YouTube.
# Manual only for now: GitHub runner IPs may get YouTube's bot check,
# so a red run here is a signal to re-check locally, not a verdict.
on:
  workflow_dispatch:

jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn -B test -Plive
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: live-reports
          path: target/surefire-reports/
